name: ADTPro
options:
  bundleIdPrefix: com.adtpro
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ADTProKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ADTPro:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: ADTProKit
        product: ADTProCore
      - package: ADTProKit
        product: DiskImage
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ADTPro
        CFBundleName: ADTPro
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: ADTPro
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "ADTPro is free software, licensed under the GNU General Public License version 2 or later."
        NSMicrophoneUsageDescription: "ADTPro listens to your Apple II's cassette output when you use the audio connection."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adtpro.ADTPro
        PRODUCT_NAME: ADTPro
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  ADTPro:
    build:
      targets:
        ADTPro: all
    run:
      config: Debug
    archive:
      config: Release
